services:

  apache:
    image: custom-apache
    container_name: apache
    build:
      context: ./requirements/apache
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
       - nginx
    networks:
      - ft_transcendence
    volumes:
      - vault_certs:/etc/apache2/ssl

  postgres:
    image: custom-postgresql
    container_name: postgres
    build:
      context: './requirements/postgresql'
      dockerfile: Dockerfile
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - vault_postgre_env:/run/secrets/postgres_env
    ports:
      - '5432:5432'
    networks:
      - database_network
    depends_on:
      - vault-agent
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: custom-backend
    container_name: backend
    build:
      context: ./requirements/backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./requirements/backend/.env.production
    networks:
      - ft_transcendence
      - database_network
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./requirements/backend/tools/entrypoint.sh:/usr/src/app/entrypoint.sh
      - vault_backend_env:/usr/src/app/vault/secrets/backend
      - vault_postgre_env:/usr/src/app/vault/secrets/postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 1m
      timeout: 10s
      retries: 5

  frontend:
    image: custom-frontend
    container_name: frontend
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - ft_transcendence
    volumes:
      - frontend_build:/usr/src/app/dist
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/src/app/build/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: custom-nginx
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - frontend_build:/usr/share/nginx/html
    networks:
      - ft_transcendence
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5

  vault:
    image: custom-vault
    container_name: vault
    build:
      context: ./requirements/vault
      dockerfile: Dockerfile
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_API_ADDR: "http://vault:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_build:/vault/data
    networks:
      vault_network:
          ipv4_address: 192.168.100.2
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  vault-init:
    image: vault-init
    container_name: vault-init
    build:
      context: ./requirements/vault-init
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
    volumes:
        - ../secrets/unseal_keys:/vault-init/unseal
        - ../secrets/ssl:/vault-init/ssl 
        - ../secrets/postgres:/vault-init/postgres
        - ../secrets/api:/vault-init/api
        - ../secrets/grafana:/vault-init/grafana
        - vault_agent_auth:/vault/auth
    networks:
      vault_network:
          ipv4_address: 192.168.100.3

  vault-agent:
    image: custom-vault-agent
    container_name: vault-agent
    build:
      context: ./requirements/vault-agent
      dockerfile: Dockerfile
    restart: always
    cap_add:
      - IPC_LOCK
      - SETFCAP
    environment:
      VAULT_ADDR: "http://vault:8200"
    volumes:
      - ./requirements/vault-agent/conf/vault-agent.hcl:/vault/config/vault-agent.hcl
      - vault_agent_auth:/vault/auth
      - vault_certs:/vault/certs
      - vault_postgre_env:/vault/postgres
      - vault_backend_env:/vault/backend
      - vault_grafana_env:/vault/grafana
    depends_on:
      - vault
    ports:
      - "8201:8201"
    networks:
      vault_network:
          ipv4_address: 192.168.100.4
      ft_transcendence: {}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: custom-grafana
    container_name: grafana
    build:
      context: ./requirements/grafana
      dockerfile: Dockerfile
    restart: always
    environment:
      - GF_PATHS_CONFIG=/vault/grafana/grafana.ini
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - vault_grafana_env:/vault/grafana:ro
    depends_on:
      - vault-agent
    networks:
      - ft_transcendence

  prometheus:
    image: custom-prometheus
    container_name: prometheus
    build:
      context: ./requirements/prometheus
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9090:9090"
    networks:
      - ft_transcendence

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    restart: always
    expose:
      - "9093"
    networks:
      - ft_transcendence

  node_exporter:
    image: prom/node-exporter
    container_name: node_exporter
    restart: always
    expose:
      - "9100"
    networks:
      - ft_transcendence

networks:
  vault_network:
    name: vault_network
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
  ft_transcendence:
    name: ft_transcendence
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  database_network:
    name: database_network
    driver: bridge

volumes:
  frontend_build:
  postgres_data:
  vault_build:
  vault_logs:
  vault_certs:
  vault_agent_auth:
  vault_postgre_env:
  vault_backend_env:
  vault_grafana_env:
  grafana_data: