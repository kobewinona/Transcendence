# NGINX USER
user www-data;

# LOAD MODSECURITY MODULE
load_module modules/ngx_http_modsecurity_module.so;

# GLOBAL EVENTS CONFIGURATION
events {
    # Default settings (can be adjusted if needed)
}

# HTTP CONFIGURATION
http {
    # MIME type definitions
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Limit concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Enable ModSecurity
    modsecurity off;
    modsecurity_rules_file /usr/local/nginx/conf/modsecurity.conf;

    # Hide Nginx version (security measure)
    server_tokens off;

    # Enable GZIP compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;

    # REDIRECT HTTP TO HTTPS
    server {
        listen 80;
        listen [::]:80;

        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS SERVER CONFIGURATION
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        # Maximum client request size
        client_max_body_size 20M;

        # SSL Certificate Configuration
        ssl_certificate /run/secrets/ssl_certificate;
        ssl_certificate_key /run/secrets/ssl_certificate_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 10m;

        # Root directory for frontend files
        root /usr/share/nginx/html;
        server_name _;
        index index.php index.html index.htm;

        # SECURITY HEADERS
        add_header X-Frame-Options "SAMEORIGIN" always; # Prevent clickjacking
        add_header X-XSS-Protection "1; mode=block" always; # XSS protection
        add_header X-Content-Type-Options "nosniff" always; # Prevent MIME type sniffing
        add_header Referrer-Policy "no-referrer-when-downgrade" always; # Control referrer policy
        add_header Content-Security-Policy "default-src 'self';
          script-src 'self' 'unsafe-eval';
          style-src 'self';
          img-src 'self' data: https://upload.wikimedia.org https://cdn.intra.42.fr;
          connect-src 'self' https://localhost wss://localhost https://api.intra.42.fr;" always;
        # `https://cdn.intra.42.fr` is used for user avatars

        # STATIC FILES CONFIGURATION
        location ~* \.(js|css|svg|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif)$ {
            modsecurity off; # Disable ModSecurity for static assets
        }

        # Block access to hidden files (e.g., .git, .htaccess)
        location ~ /\. {
            deny all;
        }

        # Serve frontend files (Single Page Application support)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # BACKEND API CONFIGURATION
        location /api/ {
            # Restrict methods for security
            limit_except GET HEAD POST OPTIONS {
                deny all;
            }

            # Proxy API requests to backend
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WEBSOCKET CONFIGURATION
        location /ws/ {
            modsecurity off;

            # Prevent abuse (limit concurrent WebSocket connections per IP)
            limit_conn perip 15;

            proxy_pass http://backend:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LOGGING CONFIGURATION
        access_log /dev/stdout;
        error_log /dev/stderr;
    }
}
